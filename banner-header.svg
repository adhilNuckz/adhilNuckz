<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Deep Cinematic Night Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040508" />
      <stop offset="60%" stop-color="#0B0D17" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>

    <!-- Gold & Electric Yellow Lightning Gradient -->
    <linearGradient id="goldBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFF200" />
      <stop offset="75%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>

    <!-- Animated RGB Spectrum Gradient -->
    <linearGradient id="rgbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055">
        <animate attributeName="stop-color" values="#FF0055;#00F0FF;#FFD700;#FF0055" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#FF0055;#00FF66;#FFD700" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#FFD700;#FF0055;#00F0FF" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Gold Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-weight: 900;
        font-size: 54px;
        fill: url(#goldBolt);
        letter-spacing: 6px;
        filter: url(#goldGlow);
      }
      .subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 16px;
        fill: #E6EDF3;
        letter-spacing: 8px;
      }
      .bolt-left {
        animation: flashLeft 2.8s infinite;
      }
      .bolt-right {
        animation: flashRight 3.4s infinite;
      }
      .strobe {
        animation: strobeFlash 2.8s infinite;
      }
      @keyframes flashLeft {
        0%, 82%, 86%, 90%, 100% { opacity: 0.12; }
        84%, 88% { opacity: 1; }
      }
      @keyframes flashRight {
        0%, 40%, 44%, 48%, 100% { opacity: 0.15; }
        42%, 46% { opacity: 1; }
      }
      @keyframes strobeFlash {
        0%, 83%, 87%, 100% { opacity: 0; }
        85% { opacity: 0.18; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" />

  <!-- Strobe Ambient Flash on Lightning Strike -->
  <rect class="strobe" width="1200" height="320" fill="#FFD700" />

  <!-- Sweeping DJ Stage Lasers -->
  <g opacity="0.35">
    <polygon points="200,0 0,320 140,320" fill="#FF0055">
      <animate attributeName="points" values="200,0 -100,320 80,320; 200,0 350,320 520,320; 200,0 -100,320 80,320" dur="5s" repeatCount="indefinite" />
    </polygon>
    <polygon points="600,0 450,320 750,320" fill="#FFD700" opacity="0.5">
      <animate attributeName="points" values="600,0 300,320 500,320; 600,0 700,320 900,320; 600,0 300,320 500,320" dur="3.5s" repeatCount="indefinite" />
    </polygon>
    <polygon points="1000,0 950,320 1150,320" fill="#00F0FF">
      <animate attributeName="points" values="1000,0 1100,320 1280,320; 1000,0 650,320 820,320; 1000,0 1100,320 1280,320" dur="4.5s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Left Gold & Yellow Lightning Bolt -->
  <g class="bolt-left" filter="url(#goldGlow)">
    <polyline points="170,0 120,105 185,115 95,230 145,235 70,320" fill="none" stroke="url(#goldBolt)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="120,105 65,165 40,210" fill="none" stroke="#FFEE00" stroke-width="2" stroke-linecap="round" />
    <polyline points="95,230 45,270" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Right Gold & Yellow Lightning Bolt -->
  <g class="bolt-right" filter="url(#goldGlow)">
    <polyline points="1030,0 1085,95 1015,110 1105,220 1050,230 1130,320" fill="none" stroke="url(#goldBolt)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="1085,95 1145,155 1175,195" fill="none" stroke="#FFEE00" stroke-width="2" stroke-linecap="round" />
    <polyline points="1105,220 1160,265" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Center High-Voltage Identity -->
  <text x="600" y="145" text-anchor="middle" class="title">ADHIL NUCKZ</text>
  <text x="600" y="185" text-anchor="middle" class="subtitle">⚡ FULL-STACK · INFRASTRUCTURE · CLOUD ⚡</text>

  <!-- Animated DJ Equalizer Spectrum Bars (Bottom Deck) -->
  <g transform="translate(150, 316) scale(1, -1)">
    <rect x="0" y="0" width="14" height="40" fill="url(#rgbGrad)" rx="2"><animate attributeName="height" values="18;75;30;90;18" dur="0.7s" repeatCount="indefinite" /></rect>
    <rect x="22" y="0" width="14" height="60" fill="#FFD700" rx="2"><animate attributeName="height" values="65;20;85;35;65" dur="0.55s" repeatCount="indefinite" /></rect>
    <rect x="44" y="0" width="14" height="30" fill="#FFEE00" rx="2"><animate attributeName="height" values="30;95;25;60;30" dur="0.65s" repeatCount="indefinite" /></rect>
    <rect x="66" y="0" width="14" height="80" fill="url(#rgbGrad)" rx="2"><animate attributeName="height" values="80;25;65;40;80" dur="0.5s" repeatCount="indefinite" /></rect>
    <rect x="88" y="0" width="14" height="45" fill="#FF0055" rx="2"><animate attributeName="height" values="25;70;40;85;25" dur="0.75s" repeatCount="indefinite" /></rect>
    <rect x="110" y="0" width="14" height="70" fill="#FFD700" rx="2"><animate attributeName="height" values="70;30;90;20;70" dur="0.6s" repeatCount="indefinite" /></rect>
    <rect x="132" y="0" width="14" height="50" fill="#00F0FF" rx="2"><animate attributeName="height" values="40;85;20;65;40" dur="0.8s" repeatCount="indefinite" /></rect>
    <rect x="154" y="0" width="14" height="60" fill="#FFEE00" rx="2"><animate attributeName="height" values="55;20;75;35;55" dur="0.52s" repeatCount="indefinite" /></rect>
    <rect x="176" y="0" width="14" height="35" fill="url(#rgbGrad)" rx="2"><animate attributeName="height" values="20;65;35;80;20" dur="0.68s" repeatCount="indefinite" /></rect>
    <rect x="198" y="0" width="14" height="75" fill="#FFD700" rx="2"><animate attributeName="height" values="75;25;55;95;75" dur="0.58s" repeatCount="indefinite" /></rect>

    <!-- Center Bass Drop Bars -->
    <rect x="380" y="0" width="16" height="50" fill="#FFD700" rx="2"><animate attributeName="height" values="30;105;40;85;30" dur="0.48s" repeatCount="indefinite" /></rect>
    <rect x="404" y="0" width="16" height="85" fill="#FFEE00" rx="2"><animate attributeName="height" values="95;35;110;45;95" dur="0.42s" repeatCount="indefinite" /></rect>
    <rect x="428" y="0" width="16" height="60" fill="url(#rgbGrad)" rx="2"><animate attributeName="height" values="45;115;30;95;45" dur="0.45s" repeatCount="indefinite" /></rect>
    <rect x="452" y="0" width="16" height="90" fill="#FFEE00" rx="2"><animate attributeName="height" values="100;40;110;35;100" dur="0.44s" repeatCount="indefinite" /></rect>
    <rect x="476" y="0" width="16" height="50" fill="#FFD700" rx="2"><animate attributeName="height" values="35;95;40;80;35" dur="0.5s" repeatCount="indefinite" /></rect>

    <!-- Right Deck Bars -->
    <rect x="680" y="0" width="14" height="75" fill="#FFD700" rx="2"><animate attributeName="height" values="75;25;55;95;75" dur="0.58s" repeatCount="indefinite" /></rect>
    <rect x="702" y="0" width="14" height="35" fill="url(#rgbGrad)" rx="2"><animate attributeName="height" values="20;65;35;80;20" dur="0.68s" repeatCount="indefinite" /></rect>
    <rect x="724" y="0" width="14" height="60" fill="#FFEE00" rx="2"><animate attributeName="height" values="55;20;75;35;55" dur="0.52s" repeatCount="indefinite" /></rect>
    <rect x="746" y="0" width="14" height="50" fill="#00F0FF" rx="2"><animate attributeName="height" values="40;85;20;65;40" dur="0.8s" repeatCount="indefinite" /></rect>
    <rect x="768" y="0" width="14" height="70" fill="#FFD700" rx="2"><animate attributeName="height" values="70;30;90;20;70" dur="0.6s" repeatCount="indefinite" /></rect>
    <rect x="790" y="0" width="14" height="45" fill="#FF0055" rx="2"><animate attributeName="height" values="25;70;40;85;25" dur="0.75s" repeatCount="indefinite" /></rect>
    <rect x="812" y="0" width="14" height="80" fill="url(#rgbGrad)" rx="2"><animate attributeName="height" values="80;25;65;40;80" dur="0.5s" repeatCount="indefinite" /></rect>
    <rect x="834" y="0" width="14" height="30" fill="#FFEE00" rx="2"><animate attributeName="height" values="30;95;25;60;30" dur="0.65s" repeatCount="indefinite" /></rect>
    <rect x="856" y="0" width="14" height="60" fill="#FFD700" rx="2"><animate attributeName="height" values="65;20;85;35;65" dur="0.55s" repeatCount="indefinite" /></rect>
    <rect x="878" y="0" width="14" height="40" fill="url(#rgbGrad)" rx="2"><animate attributeName="height" values="18;75;30;90;18" dur="0.7s" repeatCount="indefinite" /></rect>
  </g>

  <!-- Bottom Neon Laser Line -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#rgbGrad)" />
</svg>
