<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 18" width="100%" height="18">
  <defs>
    <linearGradient id="rgbLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090A0F" stop-opacity="0" />
      <stop offset="15%" stop-color="#FF0055">
        <animate attributeName="stop-color" values="#FF0055;#00F0FF;#FFD700;#FF0055" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#FFF200;#FF0055;#FFD700" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="85%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#FFD700;#00FF66;#00F0FF" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0" />
    </linearGradient>

    <filter id="laserGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base RGB Laser Beam -->
  <rect x="50" y="8" width="900" height="2" fill="url(#rgbLine)" filter="url(#laserGlow)" />

  <!-- Traveling High-Voltage Gold Spark -->
  <circle r="4" cy="9" fill="#FFF200" filter="url(#laserGlow)">
    <animate attributeName="cx" values="100;900;100" dur="2.4s" repeatCount="indefinite" />
  </circle>
</svg>
