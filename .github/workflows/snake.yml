name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: adhilNuckz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF0055&color_dots=#141622,#4D3E00,#997A00,#FFD700,#FFEE00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF0055&color_dots=#090A0F,#3D3100,#806600,#CCA300,#FFD700

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
